[project]
name = "archimple"
version = "0.1.0"
description = "Web-based CAD-style floor plan sketcher with a geometric constraint solver"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "numpy>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "selenium>=4.51.0",
]

[project.scripts]
archimple = "archimple:main"

[build-system]
requires = ["maturin>=1.8,<2.0"]
build-backend = "maturin"

[tool.maturin]
python-source = "src"
module-name = "archimple._native"
